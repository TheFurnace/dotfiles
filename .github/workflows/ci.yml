name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify and report
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: nixbuild/nix-quick-install-action@v34
        with:
          nix_conf: |
            experimental-features = nix-command flakes
      - name: Run applicable verification suites
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: python3 tests/verifications.py all --output-dir test-results
      - name: Publish unified test results
        if: ${{ always() && !cancelled() }}
        uses: dorny/test-reporter@v3
        with:
          name: Unified test results
          path: test-results/*.xml
          reporter: java-junit
          list-suites: all
          list-tests: all
