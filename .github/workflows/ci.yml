name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read
  checks: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect installer changes
    runs-on: ubuntu-latest
    outputs:
      installer: ${{ steps.filter.outputs.installer }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            installer:
              - flake.nix
              - flake.lock
              - .flake-modules/installer.nix
              - .flake-modules/lib/setup-shell.nix
              - .flake-modules/home-manager/**
              - tests/integration/**
              - tests/junit_report.py
              - tests/verifications.py
              - .github/workflows/ci.yml

  modules:
    name: Home Manager module tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: nixbuild/nix-quick-install-action@v34
      - name: Run nmt suite
        run: nix run .#packages.x86_64-linux.tests -- --junit-xml test-results/modules.xml
      - name: Upload module test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-modules
          path: test-results/modules.xml
          if-no-files-found: error

  flake-shape:
    name: Evaluate Linux outputs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: nixbuild/nix-quick-install-action@v34
      - name: Evaluate x86_64 and aarch64 outputs
        run: python3 tests/verifications.py flake-shape --junit-xml test-results/flake-shape.xml
      - name: Upload output evaluation results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-flake-shape
          path: test-results/flake-shape.xml
          if-no-files-found: error

  installer:
    name: Fresh-home bootstrap
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.installer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: nixbuild/nix-quick-install-action@v34
        with:
          nix_conf: |
            experimental-features = nix-command flakes
      - name: Run installer test
        run: >-
          python3 tests/verifications.py installer-bootstrap
          --junit-xml test-results/installer.xml
      - name: Upload installer test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-installer
          path: test-results/installer.xml
          if-no-files-found: error

  test-report:
    name: Unified test results
    needs: [modules, flake-shape, installer]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Download test results
        uses: actions/download-artifact@v8
        with:
          pattern: test-results-*
          path: test-results
          merge-multiple: true
      - name: Publish unified test results
        uses: dorny/test-reporter@v3
        with:
          name: Unified test results
          path: test-results/*.xml
          reporter: java-junit
          list-suites: all
          list-tests: all
